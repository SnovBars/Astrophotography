name: Build and Debug iOS App

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------
  # ЗАДАЧА 1: Сборка .ipa для установки на реальный iPhone
  # ---------------------------------------------------------
  build-ipa:
    runs-on: macos-26  # Xcode 26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Clean and build for iOS device (Release)
        run: |
          xcodebuild clean build \
            -project Astrophotography.xcodeproj \
            -scheme Astrophotography \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            SWIFT_STRICT_CONCURRENCY=minimal \
            -derivedDataPath DerivedData

      - name: Create Payload folder and copy .app
        run: |
          APP_PATH="DerivedData/Build/Products/Release-iphoneos/Astrophotography.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ .app not found at $APP_PATH"
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

      - name: Package IPA
        run: |
          zip -r Astrophotography.ipa Payload/

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Astrophotography-unsigned
          path: Astrophotography.ipa
          if-no-files-found: error

  # ---------------------------------------------------------
  # ЗАДАЧА 2: Запуск в симуляторе и сбор логов (Отладка)
  # ---------------------------------------------------------
  debug-simulator:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Boot Simulator (Background)
        run: |
          echo "Запускаем симулятор iPhone 17 в фоне..."
          xcrun simctl boot "iPhone 17" || true

      - name: Build for Simulator (Debug)
        run: |
          xcodebuild clean build \
            -project Astrophotography.xcodeproj \
            -scheme Astrophotography \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            SWIFT_STRICT_CONCURRENCY=minimal \
            -derivedDataPath DerivedDataSim

      - name: Wait for Simulator and Install App
        run: |
          echo "Ожидаем полной загрузки симулятора..."
          xcrun simctl bootstatus "iPhone 17" -b || true
          
          echo "Устанавливаем приложение..."
          APP_PATH="DerivedDataSim/Build/Products/Debug-iphonesimulator/Astrophotography.app"
          xcrun simctl install booted "$APP_PATH"
          
      - name: Launch App and Capture Unified Logs
        run: |
          echo "=== ЗАПУСК ПРИЛОЖЕНИЯ ===" > simulator.log
          echo "=== СИСТЕМНЫЙ ЛОГ СИМУЛЯТОРА ===" > unified.log
          
          xcrun simctl launch --console booted com.nikita.Astrophotography >> simulator.log 2>&1 &
          APP_PID=$!
          
          sleep 15
          kill $APP_PID 2>/dev/null || true
          
          xcrun simctl spawn booted log show --last 60s --style compact \
            --predicate 'process == "Astrophotography" OR eventMessage CONTAINS "Astrophotography" OR eventMessage CONTAINS "com.nikita.Astrophotography" OR eventMessage CONTAINS "AVCapture" OR eventMessage CONTAINS "TCC" OR eventMessage CONTAINS "crash"' \
            >> unified.log 2>&1 || true
          
          echo "=== КОНЕЦ ЛОГОВ ===" >> simulator.log
          echo "=== КОНЕЦ UNIFIED LOG ===" >> unified.log

      - name: Collect Any Crash Reports (Fallback)
        if: always()
        run: |
          mkdir -p CrashLogs
          cp -R ~/Library/Logs/DiagnosticReports/* CrashLogs/ 2>/dev/null || true
          find ~/Library/Developer/CoreSimulator/Devices -path "*/data/Library/Logs/CrashReporter/*" -type f -name "*.ips" -exec cp {} CrashLogs/ \; 2>/dev/null || true
          if [ -z "$(ls -A CrashLogs)" ]; then
            echo "На GitHub-раннере .ips для симулятора не создаются. Смотри unified.log" > CrashLogs/README.txt
          fi

      - name: Upload Simulator Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Simulator-Debug-Logs
          path: |
            simulator.log
            unified.log
            CrashLogs/
          if-no-files-found: warn