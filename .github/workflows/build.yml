name: Build and Debug iOS App

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------
  # ЗАДАЧА 1: Сборка .ipa для установки на реальный iPhone
  # ---------------------------------------------------------
  build-ipa:
    runs-on: macos-26  # Используем актуальный macOS 26 с Xcode 26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Clean and build for iOS device (Release)
        run: |
          xcodebuild clean build \
            -project Astrophotography.xcodeproj \
            -scheme Astrophotography \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            -derivedDataPath DerivedData

      - name: Create Payload folder and copy .app
        run: |
          APP_PATH="DerivedData/Build/Products/Release-iphoneos/Astrophotography.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "❌ .app not found at $APP_PATH"
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/

      - name: Package IPA
        run: |
          zip -r Astrophotography.ipa Payload/

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Astrophotography-unsigned
          path: Astrophotography.ipa
          if-no-files-found: error

  # ---------------------------------------------------------
  # ЗАДАЧА 2: Запуск в симуляторе и сбор логов (Отладка)
  # ---------------------------------------------------------
  debug-simulator:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      # --- ДИАГНОСТИКА ---
      - name: List available simulators and runtimes
        run: |
          echo "=== Доступные устройства ==="
          xcrun simctl list devices available
          echo "=== Установленные runtime'ы ==="
          xcrun simctl list runtimes
      # -------------------

      - name: Build for Simulator (Debug)
        run: |
          xcodebuild clean build \
            -project Astrophotography.xcodeproj \
            -scheme Astrophotography \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath DerivedDataSim

      - name: Boot Simulator and Install App
        run: |
          # Пытаемся загрузить iPhone 15, но не прерываем шаг, если его нет
          xcrun simctl boot "iPhone 15" || echo "⚠️ iPhone 15 не найден, пробуем другой..."
          
          # Ждем загрузки с таймаутом (например, 2 минуты), чтобы избежать зависания
          timeout 120s xcrun simctl bootstatus "iPhone 15" -b || true
          
          # Устанавливаем приложение
          APP_PATH="DerivedDataSim/Build/Products/Debug-iphonesimulator/Astrophotography.app"
          xcrun simctl install booted "$APP_PATH"
          
      - name: Launch App and Capture Logs
        run: |
          echo "=== ЗАПУСК ПРИЛОЖЕНИЯ ===" > simulator.log
          (timeout 15s xcrun simctl launch --console-pty booted com.nikita.astrocameramod >> simulator.log 2>&1) || true
          echo "=== КОНЕЦ ЛОГОВ ===" >> simulator.log

      - name: Collect Crash Reports
        if: always()
        run: |
          mkdir -p CrashLogs
          cp -R ~/Library/Logs/DiagnosticReports/* CrashLogs/ || true

      - name: Upload Simulator Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Simulator-Debug-Logs
          path: |
            simulator.log
            CrashLogs/
          if-no-files-found: warn