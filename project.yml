name: Astrophotography
options:
  bundleIdPrefix: com.nikita
targets:
  Astrophotography:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Astrophotography]
    info:
      path: Astrophotography/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "Нам нужна камера для съёмки звёзд и ночного неба."
        NSPhotoLibraryAddUsageDescription: "Нам нужно разрешение, чтобы сохранять ваши астрономические снимки в галерею."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        LSSupportsOpeningItemsInPlace: true
        LSSupportsOpeningItemsAtURLs: true
        LSSupportsOpeningItemsInFileExtension: "jpg,jpeg,png,gif,bmp"
        LSSupportsOpeningItemsInDirectory: true
        LSSupportsOpeningItemsInDirectoryAtURL: true
        LSSupportsOpeningItemsInDirectoryAtURLRecursively: true
        LSSupportsOpeningItemsInDirectoryAtURLRecursivelyWithFileExtension: "jpg,jpeg,png,gif,bmp"
        LSSupportsOpeningItemsInDirectoryAtURLRecursivelyWithFileExtensionIncludingSubdirectories: "jpg,jpeg,png,gif,bmp"
        LSSupportsOpeningItemsInDirectoryAtURLRecursivelyWithFileExtensionIncludingSubdirectoriesAndFiles: "jpg,jpeg,png,gif,bmp"
        LSSupportsOpeningItemsInDirectoryAtURLRecursivelyWithFileExtensionIncludingSubdirectoriesAndFilesIncludingNonImages: "jpg,jpeg,png,gif,bmp"